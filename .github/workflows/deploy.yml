name: Deploy to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'VERSION'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Services
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.64.1

      - name: Deploy Backend
        run: railway up --project 42d17b5d-61c9-4921-a21f-582d9a4c1d8a --environment production --service backend --path-as-root --detach backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Deploy Frontend
        run: railway up --project 42d17b5d-61c9-4921-a21f-582d9a4c1d8a --environment production --service frontend --path-as-root --detach frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
